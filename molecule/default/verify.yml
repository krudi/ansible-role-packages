---
- name: Verify
  hosts: all
  tasks:
    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert every converged package is installed
      ansible.builtin.assert:
        that:
          - item in ansible_facts.packages
        fail_msg: "{{ item }} is not installed"
      loop:
        - git
        - nano
        - unzip
        - curl
        - wget
